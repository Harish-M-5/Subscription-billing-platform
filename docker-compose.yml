version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: subtrack-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: subtrack-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/subscription_platform
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:8080
      UPLOAD_DIR: uploads
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - '5000:5000'

  frontend:
    build: ./frontend
    container_name: subtrack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  mongo_data:
  backend_uploads:
